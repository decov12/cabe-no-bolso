# Blueprint do Render: banco, API e site do "Cabe no bolso?".
# Passo a passo e lista de variáveis em docs/deploy.md.
# Variáveis com "sync: false" são pedidas no painel na criação do Blueprint (nunca ficam no Git).

databases:
  - name: cabe-no-bolso-db
    plan: free
    databaseName: cabe_no_bolso
    user: cabe_no_bolso

services:
  # Backend: Django + DRF servido pelo gunicorn
  - type: web
    name: cabe-no-bolso-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: cabe-no-bolso-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Frontend: React + Vite publicado como site estático
  - type: web
    name: cabe-no-bolso-site
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
    routes:
      # Qualquer caminho (/nova, /resultado/12...) devolve o index.html,
      # para o react-router funcionar ao recarregar a página.
      - type: rewrite
        source: /*
        destination: /index.html
